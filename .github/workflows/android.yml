name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Install native app-list plugin
        run: |
          mkdir -p android/app/src/main/java/com/payhub/app
          cp native/*.java android/app/src/main/java/com/payhub/app/

      - name: Declare launchable apps in manifest
        run: python3 scripts/patch_manifest.py

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pay-hub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to Releases (stable download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk pay-hub.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest pay-hub.apk --title "Pay Hub (latest)" --notes "Debug APK built from ${GITHUB_SHA::7}" --latest
